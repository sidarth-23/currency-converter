name: Deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - terraform/**
      - .github/workflows/deploy.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  APP_RUNNER_SERVICE_ARN: ${{ vars.APP_RUNNER_SERVICE_ARN }}
  FRANKFURTER_OPENAPI_URL: ${{ vars.FRANKFURTER_OPENAPI_URL }}
  VITE_API_BASE_URL: http://127.0.0.1:8080

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Install frontend dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm --dir frontend install --frozen-lockfile
      - name: Generate API clients and test
        run: |
          set -euo pipefail
          go -C backend generate ./...
          go -C backend run ./cmd/server &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true; wait "$backend_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/api/openapi.json
          pnpm --dir frontend run generate:api
          go -C backend test ./...
          pnpm --dir frontend run typecheck
          pnpm --dir frontend test
          pnpm --dir frontend run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SHA_TAG: sha-${{ github.sha }}
        run: |
          docker build -f backend/Dockerfile -t "$REGISTRY/$ECR_REPOSITORY:latest" -t "$REGISTRY/$ECR_REPOSITORY:$SHA_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_REPOSITORY:$SHA_TAG"
      - name: Wait for App Runner
        run: |
          for attempt in $(seq 1 30); do
            status=$(aws apprunner describe-service --service-arn "$APP_RUNNER_SERVICE_ARN" --query 'Service.Status' --output text)
            test "$status" = "RUNNING" && exit 0
            test "$status" = "CREATE_FAILED" -o "$status" = "UPDATE_FAILED" && exit 1
            sleep 20
          done
          exit 1
