name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - terraform/**
      - .github/workflows/deploy.yml

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_EXPRESS_SERVICE_ARN: ${{ vars.ECS_EXPRESS_SERVICE_ARN }}
  FRANKFURTER_OPENAPI_URL: ${{ vars.FRANKFURTER_OPENAPI_URL }}
  VITE_API_BASE_URL: http://127.0.0.1:8080

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Install frontend dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate
          pnpm --dir frontend install --frozen-lockfile
      - name: Generate API clients and test
        run: |
          set -euo pipefail
          go -C backend generate ./...
          go -C backend run ./cmd/server &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true; wait "$backend_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/api/openapi.json
          pnpm --dir frontend run generate:api
          go -C backend test ./...
          pnpm --dir frontend run typecheck
          pnpm --dir frontend test
          pnpm --dir frontend run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SHA_TAG: sha-${{ github.sha }}
        run: |
          docker build -f backend/Dockerfile -t "$REGISTRY/$ECR_REPOSITORY:$SHA_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$SHA_TAG"
      - name: Deploy ECS Express revision
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SHA_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$ECS_EXPRESS_SERVICE_ARN" ]; then
            echo "Image published. Set ECS_EXPRESS_SERVICE_ARN after Terraform creates the Express service."
            exit 0
          fi
          aws ecs update-express-gateway-service \
            --service-arn "$ECS_EXPRESS_SERVICE_ARN" \
            --primary-container "image=$REGISTRY/$ECR_REPOSITORY:$SHA_TAG"
          aws ecs monitor-express-gateway-service --service-arn "$ECS_EXPRESS_SERVICE_ARN"
